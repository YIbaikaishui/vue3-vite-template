version: 2
updates:
  # 前端依赖补丁/小版本：每周自动开 PR（分组合并）
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions 版本跟进
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
